name: Neon Production Backup

on:
  pull_request:
    paths:
      - '.github/workflows/neon-production-backup.yml'
      - 'scripts/backup-*.mjs'
      - 'scripts/create-encrypted-backup.sh'
      - 'tests/backup-automation.test.mjs'
      - 'docs/NEON-DISASTER-RECOVERY.md'
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *" # 04:30 Europe/Istanbul (UTC+3)

permissions:
  contents: read

concurrency:
  group: neon-production-backup
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Crypto, legacy recovery, workflow and mocked Drive tests
        run: node --test tests/backup-automation.test.mjs

  backup:
    # OFF BY DEFAULT: the schedule below only runs the secret-free `tests` job until the repository variable BACKUP_ENABLED is set to
    # 'true'. Merging this workflow never starts a production dump by itself. Only runs on main (a manual dispatch from any other ref is skipped).
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL 18 and transfer tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Create and verify authenticated encrypted backup
        id: backup
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL_BACKUP }}
          BACKUP_GCM_KEY_B64: ${{ secrets.BACKUP_GCM_KEY_B64 }}
          BACKUP_GCM_KEY_ID: ${{ vars.BACKUP_GCM_KEY_ID }}
        run: bash scripts/create-encrypted-backup.sh

      - name: Upload encrypted GitHub recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: |
            ${{ steps.backup.outputs.encrypted_file }}
            ${{ steps.backup.outputs.checksum_file }}
            ${{ steps.backup.outputs.metadata_file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload and verify Google Drive recovery copy
        env:
          RCLONE_CONFIG_B64: ${{ secrets.EGE_GDRIVE_RCLONE_CONFIG_B64 }}
          EGE_GDRIVE_FOLDER_ID: ${{ vars.EGE_GDRIVE_FOLDER_ID }}
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted_file }}
          CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          METADATA_FILE: ${{ steps.backup.outputs.metadata_file }}
        run: node scripts/backup-upload-drive.mjs

      - name: Optionally copy encrypted backup to Cloudflare R2
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted_file }}
          CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          METADATA_FILE: ${{ steps.backup.outputs.metadata_file }}
        run: |
          set -euo pipefail
          if [[ -z "$R2_ENDPOINT$R2_BUCKET$AWS_ACCESS_KEY_ID$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "Optional R2 destination is not configured"
            exit 0
          fi
          : "${R2_ENDPOINT:?Partial R2 configuration}"
          : "${R2_BUCKET:?Partial R2 configuration}"
          : "${AWS_ACCESS_KEY_ID:?Partial R2 configuration}"
          : "${AWS_SECRET_ACCESS_KEY:?Partial R2 configuration}"
          for FILE in "$ENCRYPTED_FILE" "$CHECKSUM_FILE" "$METADATA_FILE"; do
            aws s3 cp "$FILE" "s3://${R2_BUCKET}/neon/production/daily/$(basename "$FILE")" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done

      - name: Cleanup only this backup job's temporary files
        if: always()
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set -euo pipefail
          if [[ -n "$BACKUP_DIR" && "$BACKUP_DIR" == "$RUNNER_TEMP"/ege-backup.* ]]; then
            rm -rf -- "$BACKUP_DIR"
          fi
          # Private OAuth configs normally disappear in the helper's finally block.
          # Also cover a killed helper on this ephemeral, job-scoped runner.
          for DIR in "$RUNNER_TEMP"/ege-drive-*; do
            [[ ! -d "$DIR" ]] || rm -rf -- "$DIR"
          done

  notify-failure:
    needs: [tests, backup]
    if: ${{ always() && (needs.tests.result == 'failure' || needs.backup.result == 'failure' || needs.backup.result == 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Surface backup failure
        run: |
          echo "::error::Backup failed or was cancelled; a verified daily copy is not confirmed. Inspect this workflow run."
          echo "Backup failure — inspect workflow logs. No credentials are included in this summary." >> "$GITHUB_STEP_SUMMARY"
