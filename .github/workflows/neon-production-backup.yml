name: Neon Production Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *" # 04:30 Europe/Istanbul year-round equivalent for UTC+3

permissions:
  contents: read

concurrency:
  group: neon-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL_BACKUP }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing NEON_PRODUCTION_DATABASE_URL_BACKUP" >&2; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "Missing BACKUP_ENCRYPTION_PASSWORD" >&2; exit 1; }

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create and verify encrypted backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TS="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          BASE="ege-teknik-production-${TS}"
          DUMP="${BASE}.dump"
          ENC="${DUMP}.enc"

          pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$DUMP"

          # Structural integrity check before encryption.
          pg_restore --list "$DUMP" >/dev/null

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$DUMP" \
            -out "$ENC" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD

          sha256sum "$ENC" > "${ENC}.sha256"
          rm -f "$DUMP"

          echo "encrypted_file=$ENC" >> "$GITHUB_OUTPUT"
          echo "checksum_file=${ENC}.sha256" >> "$GITHUB_OUTPUT"
          echo "backup_name=$BASE" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted GitHub recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: |
            ${{ steps.backup.outputs.encrypted_file }}
            ${{ steps.backup.outputs.checksum_file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Optionally copy encrypted backup to Cloudflare R2
        if: ${{ env.R2_ENDPOINT != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp "${{ steps.backup.outputs.encrypted_file }}" \
            "s3://${R2_BUCKET}/neon/production/daily/${{ steps.backup.outputs.encrypted_file }}" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          aws s3 cp "${{ steps.backup.outputs.checksum_file }}" \
            "s3://${R2_BUCKET}/neon/production/daily/${{ steps.backup.outputs.checksum_file }}" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors

      - name: Cleanup runner files
        if: always()
        shell: bash
        run: |
          rm -f ege-teknik-production-*.dump ege-teknik-production-*.dump.enc ege-teknik-production-*.sha256 || true
