# Ege Teknik CI — four REQUIRED gates. Read-only, no deployment, no secrets, no remote databases.
# Policy (locked by tests/ci-workflow-policy.test.ts): no pull_request_target, no continue-on-error, no secrets.*,
# no Vercel/Neon/Production/Preview credentials, no `db:migrate`, no deploy steps.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Backup crypto, manifest, fake-Drive client and workflow-policy tests (no secrets, no network)
        run: pnpm test:backup

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Throwaway credentials of an ephemeral service container that only lives inside this job. Not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sprintb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real PostgreSQL integration (fails if any integration test is skipped)
        env:
          # Loopback service container only; the suite and its runner both refuse anything else.
          SPRINTB_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: pnpm test:postgres
      - name: Legal acceptance immutability on real PostgreSQL (fails on skips)
        env:
          P3B_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: pnpm test:legal-postgres
      - name: Commerce persistence suites on real PostgreSQL (fails if any DB test is skipped)
        env:
          # Loopback service container only, same database; the runner re-migrates a clean schema per
          # suite and exports the variable the suites read to the test process alone. Deliberately
          # NOT named *_DATABASE_URL: tests/ci-workflow-policy.test.ts forbids that token here.
          COMMERCE_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: pnpm test:commerce-postgres
      - name: Real Drizzle migration upgrade 0018 to 0025 (ledger 19 to 26)
        env:
          MIGRATION_UPGRADE_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: node scripts/test-migration-upgrade-pr37.mjs
      - name: Real HTTP checkout with a restricted LOGIN and disposable PostgreSQL
        env:
          # The runner refuses non-CI, non-loopback or non-sprintb targets and owns
          # the schema reset; no hosted connection or application credentials.
          CHECKOUT_HTTP_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: pnpm test:http-checkout
      - name: Mark this job's PostgreSQL service container as the disposable cluster of this run
        env:
          # Throwaway service container of this job only. The script refuses anything that is not a loopback sprintb* database inside GitHub Actions.
          MARK_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: node scripts/ci-mark-disposable-cluster.mjs
      - name: Notification worker ACL matrix and real HTTP checkout and dispatch regression (any failure or missing pass line fails the job)
        env:
          # The suites attest the cluster (loopback, no foreign database, not the recovery port, no hosted compute, PR37_DISPOSABLE_ATTEST from the
          # previous step), create their OWN new sprintb* database and roles, use a loopback mock mail provider, and drop everything afterwards.
          PR37_HTTP_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
          PR37_HTTP_DB: sprintb_pr37_http
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pr37-worker-http.log"
          node --experimental-strip-types scripts/test-pr37-worker-http.mjs 2>&1 | tee "$log"
          grep -qF "[worker-acl] PASS 11/11 checks" "$log"
          grep -qF "[pr37-http] PASS" "$log"
          grep -qF '"claimFencing":"12/12 scenarios' "$log"
          grep -qF '"sendBudget":"17/17 scenarios' "$log"
          grep -qF '"sendBudgetCheckout":"5 real checkouts' "$log"
          grep -qF "[pr37-http] cleanup: scratch database and roles dropped" "$log"
      - name: B9 AI budget on real PostgreSQL (the test must run and pass; a skip or a missing OK line fails the job)
        env:
          # Same marked service container as the worker suites; the runner attests it again, creates its OWN sprintb_b9* database, runs
          # only tests/ai-budget-db-b9.test.ts with a minimal environment and drops only that database.
          B9_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/b9-postgres.log"
          node scripts/test-b9-postgres.mjs 2>&1 | tee "$log"
          grep -qF "[b9-postgres] OK: 1 test executed against real PostgreSQL, 0 skipped." "$log"
          grep -qF "[b9-postgres] cleanup: scratch database dropped" "$log"
      - name: Database runtime attestation on real PostgreSQL sessions (a skip, a missing OK line or an incomplete cleanup fails the job)
        env:
          # Same marked service container. The runner attests it again, creates its OWN sprintb_dbatt_* databases and roles (random names and password),
          # runs only tests/db-runtime-attestation-postgres.test.ts with a minimal environment and drops only what it proves it created (oid ledger).
          # The Neon endpoint check is client-side: the Neon-form URLs in that test do NOT verify a real Neon endpoint.
          DB_ATTEST_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/db-attestation-postgres.log"
          node scripts/test-db-attestation-postgres.mjs 2>&1 | tee "$log"
          grep -qF "[db-attestation] OK: 12 tests executed against real PostgreSQL sessions, 0 skipped." "$log"
          grep -qF "[db-attestation] cleanup: scratch databases and roles dropped" "$log"
      - name: Checkout storefront ACL matrix on real PostgreSQL (a failure, a skip, a missing OK line or an incomplete cleanup fails the job)
        env:
          # Same marked service container. The runner attests it again, creates its OWN sprintb_ckacl_* database and roles (random names and password),
          # migrates it, applies docs/ops/checkout-storefront-grants-20261029.sql and drops only what it proves it created (oid ledger).
          CHECKOUT_ACL_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/checkout-acl-postgres.log"
          node scripts/test-checkout-acl-postgres.mjs 2>&1 | tee "$log"
          grep -qF "[checkout-acl] OK: 13 checks executed against real PostgreSQL sessions, 0 skipped." "$log"
          grep -qF "[checkout-acl] cleanup: scratch database and roles dropped" "$log"
      - name: H5 scoped-worker notification integration on real PostgreSQL (a failure, a skip, a missing line or an incomplete cleanup fails the job)
        env:
          # Same marked service container. The suite attests it again, creates its OWN database and roles with random per-run names, uses a
          # loopback mock instead of any mail provider, and removes only what it proves it created (oid ledger); see the header of the script.
          H5_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/h5-http.log"
          node --experimental-strip-types scripts/test-h5-notifications-http.mjs 2>&1 | tee "$log"
          grep -qF "[h5-http] PASS: scoped-worker notification integration" "$log"
          grep -qF "[h5-http] cleanup: owned resources removed" "$log"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (no source-map upload or build telemetry)
        env:
          LOCAL_BUILD_NO_UPLOAD: "1"
        run: pnpm build
      - name: The build must not change tracked files or create new ones
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  migration-safety:
    name: migration-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration 0011 is byte-identical to the reviewed version
        run: echo "f740bd31ff771742ed335aa2c2f1c3f4c44d03d30dcc9c4488c612a2c95d7626  drizzle-pg/0011_admin_governance.sql" | sha256sum --check -
      - name: Migration 0012 is byte-identical to the applied version
        run: echo "70f1d12ff909a8377dac4bad436fee1155456c82f433bc9259c64b2b4a03c3cb  drizzle-pg/0012_delivery_class.sql" | sha256sum --check -
      - name: Historical migrations 0000-0012 unchanged, journal consistent (offline, no database)
        run: pnpm verify:migrations
      - name: Migration chain 0000-0025 is complete (journal == SQL files, contiguous, timestamps increasing)
        run: |
          node -e '
            const j = require("./drizzle-pg/meta/_journal.json").entries;
            if (j.length !== 26 || j[0].tag !== "0000_black_tarot" || j[25].tag !== "0025_notification_send_budget") { console.error("expected migrations 0000-0025, found " + j.length); process.exit(1); }
            console.log("migration chain: 26 entries, 0000..0025");
          '
      - name: Migration and first-admin bootstrap safety tests
        run: >-
          node --test --experimental-strip-types
          tests/migration-integrity.test.ts
          tests/admin-governance-migration-safety.test.ts
          tests/first-admin-bootstrap.test.ts
          tests/migrator.test.ts
