# Ege Teknik CI - the four checks that branch protection requires on main: quality, build, postgres-integration, migration-safety.
# Read-only, no secrets, no deployment, no hosted database. Every job runs real checks and fails closed; nothing is skipped to "pass".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (errors fail; existing warnings are tolerated)
        run: pnpm lint
      - name: Typecheck ratchet (no new TypeScript errors beyond the recorded baseline)
        run: node scripts/ci-typecheck-baseline.mjs
      - name: Unit tests (runs when the tree defines a test script)
        run: pnpm run --if-present test

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Throwaway credentials of an ephemeral service container that only lives inside this job. Not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sprintb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a real PostgreSQL integration suite (fail closed - never a silent pass)
        run: |
          node -e '
            const s = require("./package.json").scripts ?? {};
            const need = ["test:postgres"];
            const missing = need.filter((n) => !s[n]);
            if (missing.length) { console.error("postgres-integration: FAIL - this tree defines no PostgreSQL integration suite (missing scripts: " + missing.join(", ") + "). It must not pass without one."); process.exit(1); }
          '
      - name: Real PostgreSQL integration (loopback service container only)
        env:
          SPRINTB_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: pnpm test:postgres
      - name: Optional further PostgreSQL suites when defined
        env:
          P3B_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
          COMMERCE_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
          CHECKOUT_HTTP_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/sprintb_ci
        run: |
          for s in test:legal-postgres test:commerce-postgres test:http-checkout; do
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$s"; then pnpm run "$s"; fi
          done

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enable Corepack (pnpm version comes from package.json "packageManager")
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (no source-map upload or build telemetry)
        env:
          LOCAL_BUILD_NO_UPLOAD: "1"
        run: pnpm build
      - name: The build must not change tracked files or create new untracked ones
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  migration-safety:
    name: migration-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Journal/SQL/snapshot consistency, frozen hashes, clean apply to a throw-away database (offline)
        run: node scripts/ci-verify-drizzle.mjs
