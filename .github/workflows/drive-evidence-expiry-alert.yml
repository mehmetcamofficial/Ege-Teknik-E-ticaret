name: Drive backup evidence expiry alert

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: drive-evidence-expiry-alert
  cancel-in-progress: false

jobs:
  evidence-expiry:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-backup
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check signed evidence validity and renewal window
        id: evidence
        shell: bash
        env:
          GDRIVE_FOLDER_EVIDENCE: ${{ vars.GDRIVE_FOLDER_EVIDENCE }}
          GDRIVE_EVIDENCE_PUBKEY: ${{ vars.GDRIVE_EVIDENCE_PUBKEY }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_BACKUP_FOLDER_ID }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { decodeEvidence, verifyEvidence, EVIDENCE_MAX_AGE_MS } from './lib/backup/drive-folder-safety.mjs';
          const output = process.env.GITHUB_OUTPUT;
          const emit = (status) => appendFileSync(output, 'renewal=' + status + '\n');
          try {
            const b64 = process.env.GDRIVE_FOLDER_EVIDENCE;
            const key = process.env.GDRIVE_EVIDENCE_PUBKEY;
            const folder = process.env.GDRIVE_FOLDER_ID?.trim();
            if (!b64 || !key || !folder) throw Error('missing');
            const doc = decodeEvidence(b64);
            verifyEvidence({ evidenceB64: b64, publicKeyPem: key, folderId: folder,
              driveId: '0AHAh9uEJd-AQUk9PVA', now: new Date() });
            const expiry = Date.parse(doc.evidence.observed_at) + EVIDENCE_MAX_AGE_MS;
            const hoursLeft = Math.floor((expiry - Date.now()) / 3600000);
            if (hoursLeft <= 48) {
              console.log('Drive evidence renewal required within 48 hours.');
              emit('required');
            } else {
              console.log('Drive evidence valid; renewal not yet due.');
              emit('not_due');
            }
          } catch {
            console.log('Drive evidence missing, invalid, or expired; renewal required.');
            emit('required');
          }
          NODE
      - name: Open one renewal issue when due
        if: ${{ steps.evidence.outputs.renewal == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Drive backup evidence renewal required'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Drive backup evidence renewal required"' --json number --jq 'length')"
          if [ "$existing" -eq 0 ]; then
            body="Signed Drive backup folder evidence is missing, invalid, expired or expires within 48 hours. Renew it using the company administrator identity and local Ed25519 private key. Update the production-backup environment variable GDRIVE_FOLDER_EVIDENCE. Never upload the private key. Until renewed, the backup upload fails closed. Diagnostic run: $RUN_URL"
            gh label create backup-evidence --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Drive backup evidence renewal" --force || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label backup-evidence --body "$body" ||
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            echo 'An open renewal issue already exists; no duplicate created.'
          fi
      - name: Fail visibly while renewal is required
        if: ${{ steps.evidence.outputs.renewal == 'required' }}
        run: |
          echo '::error::Drive backup evidence renewal required. See GitHub Issues.'
          exit 1
