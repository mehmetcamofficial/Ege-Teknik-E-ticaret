name: GDRIVE-03 isolated chain (synthetic, manual)

# ISOLATED from production: manual dispatch only, ref == main, environment `production-backup-test` (own variables, own folder,
# own service account). It uses NO repository or environment secret: the source database is a disposable service container filled
# with invented rows, and the encryption key is generated inside the run and masked. It cannot read the production database URL,
# the production backup key, BACKUP_ENABLED, or the production Drive folder: none of those names appear in this file (a test enforces it).
# Chain: synthetic PostgreSQL -> pg_dump -> AES-256-GCM -> Drive test folder (OIDC/WIF) -> download -> SHA-256 -> decrypt -> restore into a
# second empty database -> row/content/schema fingerprint comparison, plus wrong-key, tampered-archive and invalid-token refusals.
# Remote files are never deleted by this workflow (the Drive client has no delete); the folder owner cleans the test folder by hand.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gdrive03-isolated-chain
  cancel-in-progress: false

jobs:
  chain:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup-test
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gd03_src
      RESTORE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gd03_restore
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Create the synthetic source and the empty restore database
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gd03_src' -c 'CREATE DATABASE gd03_restore'
          psql -h 127.0.0.1 -U postgres -d gd03_src -v ON_ERROR_STOP=1 -f tests/fixtures/gdrive03-synthetic-seed.sql
      - name: Generate a one-run test encryption key (masked, never stored)
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "BACKUP_GCM_KEY_B64=$key" >> "$GITHUB_ENV"
      - name: Dump, encrypt, verify round trip, write manifest (synthetic prefix)
        id: backup
        shell: bash
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          BACKUP_PREFIX: ege-teknik-synthetic
          BACKUP_GCM_KEY_ID: gdrive03-test
        run: bash scripts/create-verified-backup.sh
      - name: Authenticate to Google Cloud (workload identity federation, no JSON key)
        id: gauth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GDRIVE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_TEST_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
      - name: Upload to the Drive TEST folder and verify the uploaded copy
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_TEST_FOLDER_ID }}
          GDRIVE_EXPECTED_ACCOUNT: ${{ vars.GDRIVE_TEST_SERVICE_ACCOUNT }}
          # Needed because Drive does not return permissions for Shared Drive folders: signed administrator evidence + its public key.
          GDRIVE_FOLDER_EVIDENCE: ${{ vars.GDRIVE_TEST_FOLDER_EVIDENCE }}
          GDRIVE_EVIDENCE_PUBKEY: ${{ vars.GDRIVE_TEST_EVIDENCE_PUBKEY }}
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted_file }}
          CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_file }}
        run: node scripts/backup-drive-upload.mjs
      - name: Download from Drive, verify SHA-256, decrypt, restore, compare, prove refusals
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_TEST_FOLDER_ID }}
          GDRIVE_EXPECTED_ACCOUNT: ${{ vars.GDRIVE_TEST_SERVICE_ACCOUNT }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
        run: node scripts/gdrive03-verify-restore.mjs
      - name: Remove local backup files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${{ steps.backup.outputs.backup_dir }}"
